version: '3.8'

services:
  binge-that-plex:
    build: .
    container_name: binge-that-plex
    ports:
      - "3002:3002"
    environment:
      - PLEX_URL=http://YOUR_PLEX_SERVER_IP:32400
      - PLEX_TOKEN=YOUR_PLEX_TOKEN_HERE
      - PORT=3002
    volumes:
      - ./data:/app/data
    restart: unless-stopped
